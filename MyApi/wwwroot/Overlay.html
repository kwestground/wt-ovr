<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SmoothStrike Overlay</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.4/signalr.min.js"></script>

    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            font-size:32px;
            margin: 0;
            
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
        }
        

        #scoreboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            bottom: 5%;
            left: 50%;
            transform: translate(-50%);
            color: white;
            padding: 0px;
            border-radius: 8px;
            width: auto; /* Anpassas efter innehållet */
            text-align: center;
        }

        #top, #sub {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            width: 100%; /* Täcker hela bredden */            
        }
        #bottom {
            display: flex;
            justify-content: center;
            align-items: center;            
            margin: 0;
            width: 100%; /* Täcker hela bredden */            
        }

        #main {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;   
            font-size: 2em;
            width: 100%; /* Täcker hela bredden */
        }

    #blueName {
        width: 500px;
        text-align: right;
        padding:10px;
        background: linear-gradient(
            270deg, 
            rgba(30, 80, 255, 0.8), 
            rgba(30, 80, 255, 0.5) 50%,
            rgba(30, 80, 255, 0.1),
            rgba(30, 80, 255, 0.0)
        );
        font-size: 0.6em;
    }
    #blueScore {
        padding:5px;
        width: 100px;
        background-color: rgba(0, 0, 255, 0.8);
    }

    #blueRoundWins {
        padding:10px;
        width: 30px;
        background-color: rgba(0, 0, 255, 0.5);
    }

    #bluePenalties {
        padding:10px;
        width: 30px;
        background-color: rgba(0, 0, 255, 0.3);
    }

    #winnerBlue {
        background-color: rgba(255, 255, 0, 0.9);
        font-weight: bold;
    }

    #winnerRed {
        background-color: rgba(255, 255, 0, 0.9);
        font-weight: bold;
    }

    #timeBoard {
        padding:0px;        
        width: 265px;
    }

    #time {
        background-color: rgba(0, 0, 0, 0.7);
        font-weight: bold;
        padding: 5px;
        vertical-align: middle;
    }

    #category {
        background-color: rgba(0, 0, 0, 0.4);
        padding:5px;
        font-size:0.8em;
        font-weight: normal;
    }

    .autohide:empty {
        display: none;
    }

    #rest {
        background-color: rgba(0, 0, 0, 0.7);
        font-weight: bold;
        display: none;
    }

    #redScore {
        padding:5px;
        width: 100px;
        background-color: rgba(255, 0, 0, 0.7);
    }

    #redRoundWins {
        padding:10px;
        width: 30px;
        background-color: rgba(255, 0, 0, 0.5);
    }

    #redPenalties {
        padding:10px;
        width: 30px;
        background-color: rgba(255, 0, 0, 0.3);
    }

    #redName {
        width: 500px;
        text-align: left;
        padding:10px;
        background: linear-gradient(
            90deg, 
            rgba(255, 30, 30, 0.8), 
            rgba(255, 30, 30, 0.5) 50%,
            rgba(255, 30, 30, 0.1),
            rgba(255, 30, 30, 0.0)
        );

        font-size: 0.6em;
    }

    #alert {
        font-weight: bold;
        background-color: rgba(255, 255, 0, 0.9);
        padding: 10px;
        margin:10px;
        color: #000;
        border: 5px solid #000;
    }

    #round {
        font-weight: bold;
        background-color: rgba(0, 0, 0, 0.4);
        padding: 10px;
    }
    #match {
        font-weight: bold;
        background-color: rgba(0, 0, 0, 0.4);
        padding: 10px;
    }

    .hidden {
        opacity: 0;
        animation: slideDown 1s ease;
        display: none;
    }

    .show {
        opacity: 1;
        animation: slideUp 1s ease;
        display: block;
    }

    #blueActions {
        color:blue;
    }

    #redActions {
        color:red;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    @keyframes slideDown {
        from {
            opacity: 1;
        }
        to {
            opacity: 0;
        }
    }
    </style>
</head>
<body>

    <div id="blueAction">
        <ul>
        </ul>
    </div>
    <div id="redAction">
        <ul>
        </ul>
    </div>

<div id="scoreboard" class="hidden">

    <div>
        <div id="top">
            <!--
            <div>
                <div id="winnerBlue" class="hidden">BLUE WINNER</div>
            </div>
            -->
            <div>
                <div id="alert" class="hidden"></span>
            </div>
            <!--
            <div>
                <div id="winnerRed" class="hidden">RED WINNER</div>

            </div>
            -->
        </div>
    </div>

    <div>
        <div id="sub">
            <div id="category" class="autohide"></span>
        </div>
    </div>
    <div id="main">
        <div id="blueName">Blå</div>
        <div id="blueScore">0</div>
        <div id="timeBoard">
            <div id="time">-:--</div>
            <div id="rest">REST</div>
        </div>
        <div id="redScore">0</div>
        <div id="redName">Röd</div>
    </div>

    <div>
        <div id="bottom">
            <div id="bluePenalties">0</div>
            <div id="blueRoundWins">0</div>
            <div id="match" class="autohide"></div>
            <div id="round" class="autohide"></div>
            <div id="redRoundWins">0</div>
            <div id="redPenalties">0</div>
        </div>
    </div>
</div>

<ul id="messagesList"></ul>
 

<script>
        var hideScoreBoardFlag = true;
        
        // set mat from querystring
        const urlParams = new URLSearchParams(window.location.search);
        const mat = urlParams.get('mat');
        const matGroup = 'mat-' + mat;
        let intervalId = null;
        let hideTimer;

        const debug = urlParams.get('debug');
        if (debug) {
            // set background-image: url('match-bg.png');
            document.body.style.backgroundImage = "url('match-bg.png')";
        }

        function setHideScoreboardTimer() {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(hideScoreBoard, 2 * 60 * 1000); // 2 minuter
        }

        let match = null;

        if (mat == null) {
            alert("No mat set in querystring (?mat=MATCODE)");
        }

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/hub")            
            .build();

        async function startConnection() {
            try {
                await connection.start()
                    .then(() => connection.invoke("JoinGroup", matGroup));

                console.log("Connected to SignalR Hub in group ", matGroup);
            } catch (err) {
                console.error("Error connecting to SignalR Hub", err);
                setTimeout(startConnection, 5000); // Retry connection
            }
        }

        function fetchMatch(matchNumber) {
            fetch(`/events-listener/match/${matchNumber}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Misslyckades med att hämta match");
                    }
                    return response.json();
                })
                .then(data => {
                    match = data;
                    console.log("Match hämtad från API:", match);
                    
                    // set same data as new match configured
                    document.getElementById("blueName").textContent = match.blueAthlete.scoreboardName;
                    document.getElementById("redName").textContent = match.redAthlete.scoreboardName;
                    document.getElementById("category").textContent = match.category.subCategory + " " + match.category.name + " - " + match.phase;
                })
                .catch(error => {
                    console.error("Fel vid hämtning av match:", error);
                });
        }

        connection.on("new-match-configured", (user, message) => {
            showScoreBoard();
            console.log("new-match-configured", message);
            document.getElementById("blueName").textContent = message.blueAthlete.scoreboardName;
            document.getElementById("redName").textContent = message.redAthlete.scoreboardName;

            document.getElementById("category").textContent = message.category.subCategory + " " + message.category.name + " - " + message.phase;
        });

        connection.on("match-result", (user, message) => {
            hideScoreBoardFlag = true;
            console.log("match-result", message);

            // timer 10 sec then hide scoreboard
            setTimeout(() => {
                if (hideScoreBoardFlag) {
                    hideScoreBoard();
                }
            }, 30000);

        });

        connection.on("new-match-event", (user, message) => {
            hideScoreBoardFlag = false;
            console.log("new-match-event", message.eventType);

            if (!match) {
                match = fetchMatch(message.matchNumber);
            }

            showScoreBoard();
            updateScoreBoard(message);

            switch (message.eventType) {
                case "START_MATCH":
                    updateTime(message);
                    break;
                case "END_ROUND":
                    // hideTime()
                    showAlert('Rest time');
                    break;

                    case "BLUE_VIDEO_REQUEST":
                    showAlert('Blue Video Request');
                    break;
                case "BLUE_VIDEO_QUOTA_ACCEPTED":
                    break;

                case "RED_VIDEO_REQUEST":
                    showAlert('Red Video Request');
                    break;
                case "RED_VIDEO_QUOTA_ACCEPTED":
                    break;

                case "START_ROUND":
                    updateTime(message);
                    updateScoreBoard(message);
                    
                    break;

                case "TIMEOUT":
                    updateTime(message);
                    showAlert('Time out');
                    break;

                case "DOCTOR":
                    updateTime(message);
                    showAlert('Doctor');
                    break;

                case "DOCTOR_QUIT":
                    updateTime(message);
                    break;

                case "RESUME":
                    updateTime(message);
                    break;

                case "MOVE_TO_NEXT_ROUND":
                    updateTime(message);
                    break;

                case "ROUNDCOUNTDOWN_CHANGE":
                    updateTime(message);
                    break;

                case "KYESHI_CHANGE":
                    updateTime(message);
                    showAlert('Key Shi');
                    break;

                case "BLUE_BODY_POINT":
                case "BLUE_ADD_NEAR_MISS_HIT":
                case "BLUE_ADD_GAME_JEON":
                case "BLUE_HEAD_POINT":
                case "BLUE_PUNCH_POINT":
                case "BLUE_HEAD_TECH_POINT":
                case "BLUE_BODY_TECH_POINT":
                    addBlueAction(message);
                    updateScoreBoard(message);
                    break;
                    
                case "RED_BODY_POINT":
                case "RED_ADD_NEAR_MISS_HIT":
                case "RED_ADD_GAME_JEON":
                case "RED_HEAD_POINT":
                case "RED_PUNCH_POINT":
                case "RED_HEAD_TECH_POINT":
                case "RED_BODY_TECH_POINT":
                    addRedAction(message);
                    updateScoreBoard(message);
                    break;

                case "BLUE_ADD_NEAR_MISS_HIT":                    
                    break;

                case "MATCH_FINISHED":
                    showAlert(message.matchWinner + " WINS BY " + message.matchFinalDecision);
                    break;

                default:
                    console.error("Unhandled message type", message);

            }

            if (message.eventType === "TIMEOUT" || message.eventType === "DOCTOR" || message.eventType === "KYESHI_CHANGE" 
                || message.eventType === "RESUME" || message.eventType === "MOVE_TO_NEXT_ROUND" 
                
                || message.eventType === "DOCTOR_QUIT") {
                if (intervalId) clearInterval(intervalId);
            }



        });

        function addBlueAction(message) {
            const action = message.eventType;
            const actionList = document.querySelector("#blueAction ul");
            const actionItem = document.createElement("li");
            actionItem.textContent = action;
            actionList.appendChild(actionItem);
        }

        function addRedAction(message) {
            const action = message.eventType;
            const actionList = document.querySelector("#redAction ul");
            const actionItem = document.createElement("li");
            actionItem.textContent = action;
            actionList.appendChild(actionItem);
        }

        function sendMessage() {
            const user = document.getElementById("userInput").value;
            const message = document.getElementById("messageInput").value;
            connection.invoke("SendMessage", user, message).catch(err => console.error(err));
        }

        function showScoreBoard() {
            document.getElementById("scoreboard").classList.remove("hidden");
            document.getElementById("scoreboard").classList.add("show");

            setHideScoreboardTimer();
        }

        function hideScoreBoard() {
            document.getElementById("scoreboard").classList.remove("show");
            document.getElementById("scoreboard").classList.add("hidden");
        }

        function showAlert(text) {
            console.log("showAlert", text);


            document.getElementById("alert").classList.remove("hidden");
            document.getElementById("alert").classList.add("show");

            document.getElementById("alert").textContent = text;
        }

        function hideAlert() {
            document.getElementById("alert").classList.remove("show");
            document.getElementById("alert").classList.add("hidden");
            document.getElementById("alert").textContent = "";
        }

        function updateScoreBoard(message) {            
            const blueScore = message.bluePoints;
            const redScore = message.redPoints;
            const round = message.roundNumberStr;

            document.getElementById("blueScore").textContent = blueScore;
            document.getElementById("redScore").textContent = redScore;
            document.getElementById("match").textContent = "" + message.matchNumber;
            document.getElementById("round").textContent = "Round " + round;
            document.getElementById("blueRoundWins").textContent = message.blueRoundWins;
            document.getElementById("redRoundWins").textContent = message.redRoundWins;
            document.getElementById("bluePenalties").textContent = message.bluePenalties;
            document.getElementById("redPenalties").textContent = message.redPenalties;
        }

        function updateTime(message) {
            
            hideAlert();
            
            //const [minutesAndSeconds] = message.roundTimestampStr.split('.');
            //document.getElementById("time").textContent = minutesAndSeconds;


            // "roundTimestampStr": "01:52.776",

            const [minutesAndSeconds, thousands] = message.roundTimestampStr.split('.');
            let [minutes, seconds] = minutesAndSeconds.split(':').map(Number);

            lastTimestamp = minutesAndSeconds;
            lastUpdateTime = Date.now();

            if (minutes === 0 && seconds < 10) {

                if (message.eventType === "ROUNDCOUNTDOWN_CHANGE" || message.eventType === "RESUME") {
                    startHundredthsEmulation();
                } else {
                    clearInterval(intervalId); // Stoppa om det inte behövs

                    let hundredths = Number(String(thousands).slice(0, -1));
                    document.getElementById("time").textContent = minutesAndSeconds + "." + hundredths;
                }
            } else {
                clearInterval(intervalId); // Stoppa om det inte behövs
                document.getElementById("time").textContent = minutesAndSeconds;
            }
        }

        function startHundredthsEmulation() {
            if (intervalId) clearInterval(intervalId); // Rensa eventuell tidigare intervall

            intervalId = setInterval(() => {
                if (lastTimestamp && lastUpdateTime) {
                    const elapsed = ((Date.now() - lastUpdateTime) / 1000) -1 ; // Sekunder sedan senaste uppdatering
                    let [minutes, seconds] = lastTimestamp.split(':').map(Number);

                    let remainingSeconds = seconds - elapsed; // Räkna ner sekunder

                    if (remainingSeconds < 0) {
                        remainingSeconds = 0; // Förhindra negativ tid
                        clearInterval(intervalId);
                    }

                    document.getElementById("time").textContent = 
                        `${String(minutes).padStart(2, '0')}:${remainingSeconds.toFixed(2).padStart(5, '0')}`;
                }
            }, 10); // Uppdatera var 10:e millisekund för att få mjuk räknare
        }


        function hideTime() {
            document.getElementById("time").textContent = "";
        }

        startConnection(); // Start the SignalR connection
    </script>
</body>
</html>
